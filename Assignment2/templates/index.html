<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Recipe Budget Finder</title>

    <style>
        :root{
        --bg: #f6f7fb;
        --card: #ffffff;
        --text: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --shadow: 0 10px 30px rgba(0,0,0,.08);
        --radius: 14px;
        }

        * { box-sizing: border-box; }

        body{
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        background: radial-gradient(1200px 600px at 10% 0%, #e9efff 0%, var(--bg) 55%, #f8fafc 100%);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px 16px;
        }

        .page{
        width: 100%;
        max-width: 820px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 26px;
        }

        .top{
        display: flex;
        justify-content: space-between;
        align-items: start;
        gap: 12px;
        margin-bottom: 16px;
        }

        h1{
        margin: 0;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.1;
        }

        .subtitle{
        margin-top: 8px;
        color: var(--muted);
        font-size: 14px;
        }

        .badge{
        border: 1px solid var(--border);
        padding: 8px 10px;
        border-radius: 999px;
        font-size: 12px;
        color: var(--muted);
        background: #fbfbfd;
        white-space: nowrap;
        }

        .search-row{
        display: flex;
        gap: 12px;
        align-items: center;
        margin-top: 10px;
        }

        #budget_input{
        flex: 1;
        height: 44px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 15px;
        outline: none;
        background: #fbfbfd;
        transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
        }

        #budget_input:focus{
        border-color: rgba(37, 99, 235, .55);
        box-shadow: 0 0 0 4px rgba(37, 99, 235, .15);
        background: #ffffff;
        }

        button{
        height: 44px;
        padding: 0 16px;
        border: 1px solid rgba(37, 99, 235, .25);
        border-radius: 10px;
        background: var(--primary);
        color: white;
        font-weight: 650;
        font-size: 15px;
        cursor: pointer;
        transition: transform .05s ease, background .15s ease, box-shadow .15s ease;
        box-shadow: 0 8px 18px rgba(37, 99, 235, .18);
        white-space: nowrap;
        }

        button:hover{ background: var(--primary-hover); }
        button:active{
        transform: translateY(1px);
        box-shadow: 0 5px 14px rgba(37, 99, 235, .16);
        }

        .hint-row{
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 10px;
        color: var(--muted);
        font-size: 13px;
        }

        .status{
        font-size: 13px;
        color: var(--muted);
        }

        #result_list{
        list-style: none;
        padding: 0;
        margin: 18px 0 0;
        display: grid;
        gap: 12px;
        }

        .card-item{
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px;
        background: #ffffff;
        box-shadow: 0 1px 0 rgba(17,24,39,.02);
        transition: border-color .15s ease, box-shadow .15s ease;
        }

        .card-item:hover{
        border-color: rgba(37, 99, 235, .25);
        box-shadow: 0 8px 20px rgba(0,0,0,.06);
        }

        .row{
        display: flex;
        justify-content: space-between;
        align-items: start;
        gap: 10px;
        }

        .name{
        font-weight: 750;
        letter-spacing: -0.01em;
        font-size: 16px;
        }

        .price{
        font-weight: 750;
        color: #0f172a;
        background: #eef2ff;
        border: 1px solid #e0e7ff;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 13px;
        white-space: nowrap;
        }

        .ingredients{
        margin-top: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        }

        .chip{
        font-size: 12px;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: #fbfbfd;
        color: #334155;
        }

        .empty{
        border: 1px dashed var(--border);
        border-radius: 12px;
        padding: 18px;
        color: var(--muted);
        background: #fafafa;
        text-align: center;
        }

        .error{
        color: #b91c1c;
        }

        @media (max-width: 520px){
        .page{ padding: 18px; }
        .top{ flex-direction: column; }
        .search-row{ flex-direction: column; align-items: stretch; }
        button{ width: 100%; }
        .hint-row{ flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>

<body>
    <main class="page">
        <div class="top">
            <div>
                <h1>Recipe Budget Finder</h1>
                <div class="subtitle">Type a budget and we'll show recipes that cost that much or less.</div>
            </div>
            <div class="badge">Flask + JSON</div>
        </div>

        <div class="search-row">
            <input id="budget_input" type="number" step="0.01" min="0" placeholder="e.g. 10.00" />
            <button id="search_btn">Search</button>
        </div>

        <div class="hint-row">
        <div>Tip: press <b>Enter</b> to search.</div>
        <div id="status" class="status"></div>
        </div>

        <ul id="result_list"></ul>
    </main>

    <script>
        const input = document.getElementById("budget_input");
        const btn = document.getElementById("search_btn");
        const list = document.getElementById("result_list");
        const statusEl = document.getElementById("status");

        function money(n) {
            return new Intl.NumberFormat(undefined, { style: "currency", currency: "USD" }).format(n);
        }

        function setStatus(msg, isError=false) {
            statusEl.textContent = msg || "";
            statusEl.classList.toggle("error", !!isError);
        }

        function renderEmpty(message) {
            list.innerHTML = `<li class="empty">${message}</li>`;
        }

        function renderRecipes(recipes) {
            list.innerHTML = "";
            recipes.forEach(r => {
                const chips = (r.ingredients || []).map(i => `<span class="chip">${i}</span>`).join("");
                const li = document.createElement("li");
                li.className = "card-item";
                li.innerHTML = `
                    <div class="row">
                        <div class="name">${r.name}</div>
                        <div class="price">${money(r.price)}</div>
                    </div>
                    <div class="ingredients">${chips}</div>
                `;
                list.appendChild(li);
            });
        }

        async function search() {
            const budget = Number(input.value);

            if (!input.value || Number.isNaN(budget) || budget < 0) {
                setStatus("Enter a valid budget (0 or higher).", true);
                renderEmpty("Waiting for a budget…");
                return;
            }

            setStatus("Searching...");
            renderEmpty("Loading…");

            try {
                const res = await fetch(`/search/${encodeURIComponent(budget)}`);
                if(!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();

                if(!Array.isArray(data)) throw new Error("Expected JSON array");

                setStatus(`Found ${data.length} recipe${data.length === 1 ? "" : "s"}.`);
                if (data.length === 0) {
                    renderEmpty(`No recipes under ${money(budget)}. Try a higher budget.`);
                    return;
                }

                renderRecipes(data);
            } catch (err) {
                console.error(err);
                setStatus("Request failed. Check the Flask server + route.", true);
                renderEmpty("Couldn’t load results.");
            }
        }

        btn.addEventListener("click", search);
        input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") search();
        });

        // Initial empty state
        renderEmpty("Enter a budget to see recipes.");
    </script>
</body>
</html>
